name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag matches package version
        run: node -e "const p=require('./package.json'); const expected='v'+p.version; if(process.env.GITHUB_REF_NAME!==expected) throw new Error('Release tag '+process.env.GITHUB_REF_NAME+' does not match package version '+expected)"
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --win --x64 --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: omp-desktop-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            artifact: apple-silicon
          - runner: macos-15-intel
            arch: x64
            artifact: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag matches package version
        run: node -e "const p=require('./package.json'); const expected='v'+p.version; if(process.env.GITHUB_REF_NAME!==expected) throw new Error('Release tag '+process.env.GITHUB_REF_NAME+' does not match package version '+expected)"
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: omp-desktop-macos-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
